<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor 展示系统</title><link rel="stylesheet" href="/styles.css"></head>
<body><main id="app">
<section id="home" class="view active"><div class="hero"><canvas id="hero-ink" width="900" height="620"></canvas><div class="hero-caption">一笔一画，感知墨与纸的相遇</div></div><div class="entry-grid"><button data-view="human"><span class="entry-mark">感</span><strong>人工书写</strong><small>观察传感毛笔的实时信号</small></button><button data-view="robot"><span class="entry-mark">书</span><strong>机械臂书写</strong><small>输入汉字并观看机械臂书写</small></button></div></section>
<section id="human" class="view"><button class="back" data-view="home">返回首页</button><div class="human-layout"><div class="xy-panel"><div class="panel-heading"><span>笔尖轨迹 · ΔBx / ΔBy（µT）</span><span id="contact">离开</span></div><canvas id="xy" width="900" height="650"></canvas><div class="xy-foot"><button id="baseline">取基线</button><span id="sensor-status" class="warning">未连接</span></div></div><aside class="sensor-side"><div class="connection-card"><h2>传感器连接</h2><label>串口<input id="serial-port" value="/dev/ttyUSB0" autocomplete="off"></label><label>波特率<select id="serial-baud"><option>115200</option><option>9600</option></select></label><div class="connection-actions"><button id="connect-sensor">连接板卡</button><button id="disconnect-sensor">断开</button></div><p id="sensor-detail">请输入串口并连接板卡</p></div><div class="signal-card"><h3>X 信号 <span id="signal-x-value">—</span></h3><canvas id="signal-x" width="520" height="190"></canvas></div><div class="signal-card"><h3>Y 信号 <span id="signal-y-value">—</span></h3><canvas id="signal-y" width="520" height="190"></canvas></div></aside></div></section>
<section id="robot" class="view"><button class="back" data-view="home">返回首页</button><aside><label>输入汉字<input id="character" maxlength="1" autocomplete="off"></label><p>推荐汉字 <span id="presets"><button>永</button><button>山</button><button>人</button><button>和</button></span></p><div class="mode"><button data-mode="ink" class="active">墨迹效果</button><button data-mode="path">笔画路径</button></div><p id="input-error" class="warning"></p><p id="robot-status">READY</p><button id="dip">沾墨水</button><button id="return">回到原点</button><button id="write" disabled>开始书写</button><button id="pause" disabled>暂停</button><button id="stop" disabled>停止书写</button></aside><canvas id="paper" width="720" height="720"></canvas></section>
</main><script src="/app.js"></script></body></html>
