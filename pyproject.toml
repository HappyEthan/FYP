[project]
name = "brushbot"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "matplotlib", "mujoco"]

[project.optional-dependencies]
monitor = ["pyqtgraph>=0.13", "PyQt5>=5.15", "pyserial>=3.5", "websocket-client>=1.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brushbot.stroke_templates" = ["teaching_assets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
